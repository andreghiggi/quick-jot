name: Cursor CI

on:
  push:
    branches: [Cursor]
  pull_request:
    branches: [Cursor]

run-name: Cursor - ${{ github.event.head_commit.message || github.event.pull_request.title }}

jobs:
  validate:
    name: Cursor - Build e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
