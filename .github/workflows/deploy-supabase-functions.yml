# Deploy Edge Functions → Supabase Comanda (iwmrtxdzlkasuzutxvhh)
# Secret: SUPABASE_ACCESS_TOKEN → https://supabase.com/dashboard/account/tokens

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: iwmrtxdzlkasuzutxvhh

    steps:
      - uses: actions/checkout@v4

      - name: Verificar secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Defina SUPABASE_ACCESS_TOKEN em GitHub → Settings → Secrets → Actions"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Secrets fiscais (emit VPS)
        run: |
          supabase secrets set \
            NFCE_API_URL=https://emit.agilizeerp.com.br/functions/v1/nfce-api \
            NFE_API_URL=https://emit.agilizeerp.com.br/functions/v1/nfe-api \
            --project-ref "$PROJECT_ID"

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"
