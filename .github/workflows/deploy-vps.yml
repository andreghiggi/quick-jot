name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Comanda Tech VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase secrets point to Lovable Cloud
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERRO: secret VITE_SUPABASE_URL não configurado"
            exit 1
          fi
          if echo "$VITE_SUPABASE_URL" | grep -q 'api.comandatech.com.br'; then
            echo "ERRO: VITE_SUPABASE_URL ainda aponta para VPS API"
            echo "Defina: https://iwmrtxdzlkasuzutxvhh.supabase.co"
            exit 1
          fi
          if ! echo "$VITE_SUPABASE_URL" | grep -qE 'iwmrtxdzlkasuzutxvhh|\.supabase\.co'; then
            echo "ERRO: VITE_SUPABASE_URL deve ser Lovable Cloud (iwmrtxdzlkasuzutxvhh.supabase.co)"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "ERRO: VITE_SUPABASE_PUBLISHABLE_KEY vazio — app trava em Carregando"
            exit 1
          fi
          echo "OK: VITE_SUPABASE_URL=$VITE_SUPABASE_URL"

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'iwmrtxdzlkasuzutxvhh' }}
        run: npm run build

      - name: Validate bundle (Lovable URL + anon key)
        run: node scripts/validate-bundle.mjs

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy dist to VPS
        run: |
          tar -C dist -czf /tmp/comandatech-dist.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/comandatech-dist.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/comandatech-dist.tar.gz
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            echo "==> Preparing static deploy"
            rm -rf /tmp/comandatech-dist
            mkdir -p /tmp/comandatech-dist /var/www/comandatech/dist
            tar -xzf /tmp/comandatech-dist.tar.gz -C /tmp/comandatech-dist
            echo "==> Publishing dist"
            rm -rf /var/www/comandatech/dist/*
            cp -a /tmp/comandatech-dist/. /var/www/comandatech/dist/
            rm -f /tmp/comandatech-dist.tar.gz
            echo "==> Reloading Nginx"
            systemctl reload nginx
            echo "==> Smoke test produção"
            cd /var/www/comandatech && node scripts/validate-prod-bundle.mjs || exit 1
            echo "==> Deploy complete!"
          ENDSSH