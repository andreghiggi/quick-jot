name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Comanda Tech VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase secrets point to VPS API
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERRO: secret VITE_SUPABASE_URL não configurado"
            exit 1
          fi
          if ! echo "$VITE_SUPABASE_URL" | grep -q 'api.comandatech.com.br'; then
            echo "ERRO: VITE_SUPABASE_URL deve ser https://api.comandatech.com.br"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "ERRO: VITE_SUPABASE_PUBLISHABLE_KEY vazio — app trava em Carregando"
            exit 1
          fi
          echo "OK: VITE_SUPABASE_URL=$VITE_SUPABASE_URL"

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'comandatech-vps' }}
        run: npm run build

      - name: Validate bundle (VPS URL + anon key)
        run: node scripts/validate-bundle.mjs

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Atualizar config Nginx da API (imagens públicas) com rollback
        run: |
          scp -i ~/.ssh/deploy_key deploy/nginx/api.comandatech.com.br.conf root@${{ secrets.VPS_HOST }}:/tmp/api.comandatech.com.br.conf
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            target=/etc/nginx/sites-available/api.comandatech.com.br.conf
            if [ ! -f "$target" ]; then
              echo "AVISO: $target não existe; pulando atualização do Nginx"
              exit 0
            fi
            backup="/root/nginx-backups/api.conf.$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p /root/nginx-backups
            cp -a "$target" "$backup"
            cp -a /tmp/api.comandatech.com.br.conf "$target"
            if ! nginx -t; then
              echo "==> Config inválida; restaurando anterior"
              cp -a "$backup" "$target"
              nginx -t
              exit 1
            fi
            systemctl reload nginx
            echo "==> Nginx da API atualizado (backup em $backup)"
          ENDSSH

      - name: Deploy dist to VPS with immediate rollback
        run: |
          tar -C dist -czf /tmp/comandatech-dist.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/comandatech-dist.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/comandatech-dist.tar.gz
          scp -i ~/.ssh/deploy_key scripts/validate-prod-bundle.mjs root@${{ secrets.VPS_HOST }}:/tmp/validate-prod-bundle.mjs
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            echo "==> Preparing static deploy"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            release="/var/www/comandatech/releases/$stamp"
            previous="/var/www/comandatech/releases/${stamp}-previous"
            rm -rf /tmp/comandatech-dist "$release" "$previous"
            mkdir -p /tmp/comandatech-dist "$release" /var/www/comandatech/releases
            tar -xzf /tmp/comandatech-dist.tar.gz -C /tmp/comandatech-dist
            cp -a /tmp/comandatech-dist/. "$release/"
            if [ -d /var/www/comandatech/dist ]; then
              cp -a /var/www/comandatech/dist "$previous"
            fi
            echo "==> Publishing dist (mantendo assets antigos por 24h)"
            # 1) Sincroniza tudo menos /assets: index.html e afins sempre atualizados na hora
            rsync -a --delete --exclude '/assets/***' "$release/" /var/www/comandatech/dist/
            # 2) Assets sao acumulativos (nomes com hash unico) — nada e apagado agora,
            #    para que abas ja abertas na versao anterior continuem carregando sem 404
            mkdir -p /var/www/comandatech/dist/assets
            rsync -a "$release/assets/" /var/www/comandatech/dist/assets/
            # Marca os assets desta versao como recem-publicados (protege da limpeza)
            find "$release/assets" -type f -printf '%P\n' | while read -r f; do touch "/var/www/comandatech/dist/assets/$f"; done
            # 3) Limpeza: remove apenas assets nao modificados ha mais de 24h
            find /var/www/comandatech/dist/assets -type f -mmin +1440 -delete || true
            find /var/www/comandatech/dist/assets -type d -empty -delete || true
            rm -f /tmp/comandatech-dist.tar.gz
            echo "==> Reloading Nginx"
            systemctl reload nginx
            echo "==> Smoke test produção"
            if ! node /tmp/validate-prod-bundle.mjs; then
              echo "==> Smoke test falhou; restaurando bundle anterior"
              if [ -d "$previous" ]; then
                rsync -a --delete "$previous/" /var/www/comandatech/dist/
                systemctl reload nginx
              fi
              exit 1
            fi
            echo "==> Deploy complete!"
          ENDSSH