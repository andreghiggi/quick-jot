# API ComandaTech self-hosted (nginx -> docker)
# Copiar para /etc/nginx/sites-available/api.comandatech.com.br.conf

map $http_origin $cors_origin {
    default $http_origin;
    "" "*";
}

server {
    listen 80;
    server_name api.comandatech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.comandatech.com.br;

    ssl_certificate /etc/letsencrypt/live/comandatech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comandatech.com.br/privkey.pem;

    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 8 64k;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, Prefer, Range, Accept, Accept-Profile, Content-Profile, X-Requested-With, x-upsert, x-supabase-client-platform, x-supabase-client-platform-version, x-supabase-client-runtime, x-supabase-client-runtime-version" always;
    add_header Access-Control-Expose-Headers "Content-Range, X-Supabase-Api-Version, Preference-Applied, Content-Location, Location" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:54322/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:54321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:54325/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ~ ^/storage/v1/object/public/product-images/(.+)$ {
        alias /opt/apps/comandatech-api/supabase/data/storage/stub/stub/product-images/$1;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:54323/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location /functions/v1/ {
        proxy_pass http://127.0.0.1:54324/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location = / {
        return 200 '{"ok":true,"service":"comandatech-api"}';
        add_header Content-Type application/json;
    }
}
