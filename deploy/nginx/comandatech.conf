# REDIRECT 301: agilizeerp -> comandatech
server {
    listen 80;
    listen [::]:80;
    server_name appcomandatech.agilizeerp.com.br *.agilizeerp.com.br agilizeerp.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name appcomandatech.agilizeerp.com.br *.agilizeerp.com.br agilizeerp.com.br;

    ssl_certificate /etc/letsencrypt/live/appcomandatech.agilizeerp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appcomandatech.agilizeerp.com.br/privkey.pem;

    set $new_host "app.comandatech.com.br";
    if ($host ~* "^(.+)\.agilizeerp\.com\.br$") { set $new_host "$1.comandatech.com.br"; }
    if ($host = "appcomandatech.agilizeerp.com.br") { set $new_host "app.comandatech.com.br"; }
    if ($host = "agilizeerp.com.br") { set $new_host "app.comandatech.com.br"; }

    return 301 https://$new_host$request_uri;
}

server {
    listen 80;
    server_name comandatech.com.br *.comandatech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name comandatech.com.br *.comandatech.com.br;

    ssl_certificate /etc/letsencrypt/live/comandatech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comandatech.com.br/privkey.pem;

    root /var/www/comandatech/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        gzip_static on;
    }

    gzip_static on;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;

    client_max_body_size 20M;
}
