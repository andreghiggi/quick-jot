    <script>
      // Redireciona automaticamente o domínio antigo para o novo,
      // preservando rota completa (ex: /cardapio/lancheria-da-i9-263ee29a)
      (function () {
        try {
          var h = window.location.hostname;
          if (h === 'appcomandatech.agilizeerp.com.br' || h.endsWith('.agilizeerp.com.br')) {
            var newHost = (h === 'appcomandatech.agilizeerp.com.br')
              ? 'app.comandatech.com.br'
              : h.replace('.agilizeerp.com.br', '.comandatech.com.br');
            window.location.replace(
              'https://' + newHost + window.location.pathname + window.location.search + window.location.hash
            );
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <div id="boot-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#737373;background:#fafafa">
        Carregando ComandaTech…
      </div>
    </div>
    <script>
      (function () {
        // Esta tela de erro só pode aparecer quando o aplicativo NÃO conseguiu
        // iniciar (a mensagem "Carregando ComandaTech…" ainda está no lugar).
        // Antes, qualquer erro da página — inclusive de uma imagem, extensão ou
        // script externo — apagava a aplicação já aberta e o operador via tela
        // de erro com o sistema funcionando.
        var shown = false;
        var watchdog;

        function appStarted() {
          var splash = document.getElementById('boot-splash');
          if (!splash) return true; // React já substituiu o conteúdo inicial
          var root = document.getElementById('root');
          return !!(root && root.children.length > 1);
        }

        function showBootError(reason) {
          if (shown) return;
          shown = true;
          console.error('[boot] falha ao iniciar o aplicativo', reason);
          if (watchdog) window.clearTimeout(watchdog);
          var existing = document.getElementById('boot-error');
          if (existing) return;
          var errorBox = document.createElement('div');
          errorBox.id = 'boot-error';
          errorBox.setAttribute('role', 'alert');
          errorBox.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#fafafa;color:#171717';
          errorBox.innerHTML = '<div style="width:100%;max-width:360px;padding:24px;text-align:center;background:#fff;border:1px solid #e5e5e5;border-radius:8px"><strong style="display:block;font-size:18px">Não foi possível abrir o sistema</strong><p style="margin:12px 0 20px;color:#525252;font-size:14px;line-height:1.5">Recarregue para buscar a versão atual. Seus dados não serão apagados.</p><button type="button" style="width:100%;border:0;border-radius:6px;padding:12px;background:#ef4444;color:#fff;font-weight:600;cursor:pointer">Recarregar</button></div>';
          errorBox.getElementsByTagName('button')[0].onclick = function () { window.location.reload(); };
          document.body.appendChild(errorBox);
        }

        window.addEventListener(
          'error',
          function (ev) {
            var target = ev.target;
            var isResource =
              target && target !== window && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
            // Só consideramos falhas de carregamento do próprio aplicativo.
            if (isResource) {
              var src = target.src || target.href || '';
              if (src.indexOf('/assets/') === -1 && src.indexOf('/src/') === -1) return;
              showBootError(src);
              return;
            }
            window.setTimeout(function () {
              if (!appStarted()) showBootError(ev.error || ev.message);
            }, 0);
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (ev) {
          window.setTimeout(function () {
            if (!appStarted()) showBootError(ev.reason || 'Falha inesperada ao iniciar');
          }, 0);
        });

        watchdog = window.setTimeout(function () {
          var root = document.getElementById('root');
          var text = root ? (root.innerText || '').replace(/v\d+\.\d+\.\d+[^\n]*/g, '').trim() : '';
          if (!root || !text) showBootError('A tela principal não apresentou conteúdo');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
